<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1 class="header-title">Smart Expense Tracker</h1>
            <div class="header-balance">
                <span class="balance-label">Balance:</span>
                <span id="headerBalance" class="balance-amount">₹0</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <!-- Dashboard Section -->
            <section class="dashboard">
                <div class="dashboard-cards">
                    <div class="dashboard-card income-card">
                        <div class="card-icon">💰</div>
                        <div class="card-content">
                            <h3>Monthly Income</h3>
                            <span id="monthlyIncome" class="card-amount">₹0</span>
                        </div>
                    </div>
                    
                    <div class="dashboard-card spent-card">
                        <div class="card-icon">💸</div>
                        <div class="card-content">
                            <h3>Total Spent</h3>
                            <span id="totalSpent" class="card-amount">₹0</span>
                        </div>
                    </div>
                    
                    <div class="dashboard-card balance-card">
                        <div class="card-icon">💳</div>
                        <div class="card-content">
                            <h3>Remaining</h3>
                            <span id="remainingBalance" class="card-amount">₹0</span>
                        </div>
                    </div>
                </div>

                <button id="setIncomeBtn" class="set-income-btn">Set Monthly Income</button>
            </section>

            <!-- Month Comparison Section -->
            <section class="month-comparison-section">
                <div id="monthComparison" class="month-comparison">
                    <div class="comparison-message">Loading comparison...</div>
                </div>
            </section>

            <!-- Calendar and Charts Container -->
            <div class="content-grid">
                <!-- Calendar Section -->
                <section class="calendar-section">
                    <div class="calendar-header">
                        <button id="prevMonth" class="nav-btn">‹</button>
                        <h2 id="currentMonth" class="month-title">January 2024</h2>
                        <button id="nextMonth" class="nav-btn">›</button>
                    </div>
                    
                    <div class="calendar">
                        <div class="calendar-weekdays">
                            <div class="weekday">Sun</div>
                            <div class="weekday">Mon</div>
                            <div class="weekday">Tue</div>
                            <div class="weekday">Wed</div>
                            <div class="weekday">Thu</div>
                            <div class="weekday">Fri</div>
                            <div class="weekday">Sat</div>
                        </div>
                        <div id="calendarDates" class="calendar-dates"></div>
                    </div>
                </section>

                <!-- Charts Section -->
                <section class="charts-section">
                    <div class="chart-container">
                        <h3>Spending Overview</h3>
                        <div class="chart-with-legend">
                            <div class="chart-area">
                                <canvas id="categoryChart" width="280" height="280"></canvas>
                            </div>
                            <div class="legend-area" id="categoryLegend">
                                <div class="legend-title">Categories</div>
                            </div>
                        </div>
                    </div>

                    <div class="chart-container">
                        <h3>Daily Spending</h3>
                        <canvas id="dailyChart" width="300" height="200"></canvas>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <!-- Income Modal -->
    <div id="incomeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Set Monthly Income</h3>
                <button id="closeIncomeModal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="incomeAmount">Monthly Income (₹)</label>
                    <input type="number" id="incomeAmount" placeholder="Enter your monthly income" min="0" step="0.01">
                </div>
            </div>
            <div class="modal-footer">
                <button id="saveIncome" class="btn btn-primary">Save Income</button>
            </div>
        </div>
    </div>

    <!-- Expense Modal -->
    <div id="expenseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="expenseModalTitle">Add Expense</h3>
                <button id="closeExpenseModal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="expenseName">Expense Name</label>
                    <input type="text" id="expenseName" placeholder="e.g., Groceries, Transportation">
                </div>
                
                <div class="form-group">
                    <label for="expenseCategory">Category</label>
                    <select id="expenseCategory">
                        <option value="Food">🍔 Food</option>
                        <option value="Transportation">🚗 Transportation</option>
                        <option value="Entertainment">🎬 Entertainment</option>
                        <option value="Shopping">🛒 Shopping</option>
                        <option value="Bills">🧾 Bills</option>
                        <option value="Health">🏥 Health</option>
                        <option value="Education">📚 Education</option>
                        <option value="Other">📦 Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="expenseAmount">Amount (₹)</label>
                    <input type="number" id="expenseAmount" placeholder="0.00" min="0" step="0.01">
                </div>

                <div id="expensesList" class="expenses-list"></div>
            </div>
            <div class="modal-footer">
                <button id="saveExpense" class="btn btn-primary">Add Expense</button>
                <button id="updateExpense" class="btn btn-secondary" style="display: none;">Update Expense</button>
            </div>
        </div>
    </div>

    <!-- Overlay -->
    <div id="overlay" class="overlay"></div>

    <script src="script.js"></script>
</body>
</html>
